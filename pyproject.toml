[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "askmydoc-cli"
version = "0.1.0"
description = "Terminal entry point for AskMyDoc"
requires-python = ">=3.11"

[project.scripts]
askmydoc = "askmydoc_cli.__main__:main"

[tool.setuptools.packages.find]
include = ["askmydoc_cli*"]
